{% extends "base.html" %}{% block title %}{{ titulo }}{% endblock %}{% block content %}
<div class="page-heading mb-4"><div><a class="back-link" href="{% url 'portal_home' %}">← Área de trabalho</a><h1 class="h2 mt-2 mb-0">{{ titulo }}</h1></div>{% if can_manage %}<div class="d-flex gap-2"><a class="btn btn-outline-success" href="/portal/registro/{{ tipo }}/{{ objeto.pk }}/editar/">Editar</a><form method="post" action="/portal/registro/{{ tipo }}/{{ objeto.pk }}/excluir/">{% csrf_token %}<button class="btn btn-outline-danger" onclick="return confirm('Excluir este registro? Esta ação não pode ser desfeita.')">Excluir</button></form></div>{% endif %}</div>
<section class="card"><div class="card-body p-4"><dl class="record-fields row mb-0">{% for label,value in valores %}<dt class="col-sm-4 col-lg-3">{{ label }}</dt><dd class="col-sm-8 col-lg-9">{{ value|default:"—" }}</dd>{% endfor %}</dl></div></section>{% endblock %}
