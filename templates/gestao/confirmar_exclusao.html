{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card border-danger shadow-sm"><div class="card-body p-4">
<h1 class="h4">{{ titulo }}</h1><p>Tem certeza de que deseja excluir <strong>{{ objeto }}</strong>? Esta ação não poderá ser desfeita.</p>
<form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">Confirmar exclusão</button> <a class="btn btn-outline-secondary" href="{{ voltar }}">Cancelar</a></form>
</div></div></div></div>
{% endblock %}
